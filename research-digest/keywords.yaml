# ─────────────────────────────────────────────────────────────
# 过滤规则
# ─────────────────────────────────────────────────────────────
deprioritize:
  - general LLM fine-tuning（无 KV cache 交集时）
  - RLHF alignment safety（无 KV cache 交集时）
  - generic benchmark leaderboard 发布
  - 视觉 token merging / ViT 压缩
  # 降级规则：纯算法 KV 压缩
  - 纯算法 KV 压缩 / 量化，且只在单轮长文档 benchmark（LongBench / RULER / NIAH 等）评测、
    不涉及 agent / 多轮 / 结构信号 → 最多进"📦 Baseline 动态"一行，绝不进 🔥
  # 纯文本层 agent 工作，默认过滤
  - 纯文本 agent memory / summarization / scratchpad（不触及 KV cache 时）
  - agent prompt engineering / planning 框架本身（无 serving / KV 层贡献时）
  - 纯 RAG 检索质量 / embedding（不落到 KV 复用时）
  - agent 能力评测榜单（不分析 context / KV 代价时）

deprioritize_exceptions: # 以下情况即使是文本层工作也保留，标注为"信号来源"
  - 提出了可被 KV 层消费的结构信号（episode 类型、依赖图、生命周期状态、失败 / 覆盖标记）
  - 明确测量或讨论其对 prefix cache 命中率 / re-prefill 代价的影响
  - 公开了带工具调用结构的 agent 轨迹数据集