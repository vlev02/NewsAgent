# LLM 研究追踪关键词库 v2 —— 主轴：Agent ↔ KV 协同（StructKV 方向）
#
# 方向调整（2026-09-22）：
# - 主轴从"KV 压缩算法"切换为"agent 结构语义如何驱动 KV 层管理"，即 StructKV (P2)
#   与 Agentic KV Runtime (P3) 所在的交叉带：结构信号 → KV 指令 → 原地编辑执行。
# - 纯算法 KV 压缩（注意力打分式 eviction、量化、低秩、单轮长文档压缩）降级为
#   baseline 追踪：每周搜一次，只关心它是否成为新的强 baseline，或开始在 agent /
#   多轮场景上评测。
# - 位置管理（prune 后 reindex / RoPE 校正）保留在核心层：它是原地编辑的执行前提（P1 ReClaim）。
#
# 更新原则：
# - 发现新术语（尤其是论文自造词，如 "KV directives" / "positional coherence" /
#   "co-attended survivors"）就加进对应 tier。
# - 连续 2 周没有产出相关信号的词，考虑降级或删除。
# - 每次改动就是一次 commit，这个文件的 git history 本身就是"关注点演化记录"。
# - 本文件由人工维护；digest routine 只读不写。
#
# 最后更新：2026-09-22

# ─────────────────────────────────────────────────────────────
# 搜索频率策略（routine 按此执行）
# ─────────────────────────────────────────────────────────────
search_policy:
  daily:
    - tier_0_agent_kv_bridge
    - tier_1_runtime_serving_interface
    - tier_2_agent_workload_evidence
    - watchlist_entities.core_competitors
    - watchlist_entities.agent_serving_systems
  weekly_monday: # 仅在运行日为周一时搜索
    - tier_3_kv_algorithm_baselines
    - tier_4_positional_adjacent
    - watchlist_entities.baselines
    - watchlist_entities.agent_runtimes

# ─────────────────────────────────────────────────────────────
# 主轴
# ─────────────────────────────────────────────────────────────
tier_0_agent_kv_bridge: # 每次必搜；命中且满足 A 级判据 → 进入 🔥 候选
  # —— 结构信号 → KV 操作（StructKV 本体）——
  - structure-aware KV cache eviction agent
  - episode-level KV cache pruning
  - tool call aware KV cache management
  - semantic block KV cache eviction
  - agent context dependency graph eviction
  - intent-aware KV cache pruning multi-turn
  # —— KV 层原地编辑原语（P3 执行侧）——
  - KV cache directives
  - in-place KV cache editing
  - KV cache splice delete without re-prefill
  - context editing prefix cache preservation
  # —— 原地编辑的执行前提（P1 ReClaim）——
  - position re-indexing KV cache
  - RoPE correction pruned KV cache
  # —— agent 场景下 KV 失效与重算代价（动机侧）——
  - context engineering KV cache invalidation
  - agent re-prefill cost TTFT
  - prefix cache invalidation tool call
  - stateful inference persistent KV multi-turn

tier_1_runtime_serving_interface: # Agent Runtime ↔ Serving 接口与协同（P3 + 接口边界调研）
  - agent runtime LLM serving co-design
  - agentic workload KV cache serving
  - KV cache aware agent scheduling
  - stateful LLM serving session API
  - agentic workflow prefix caching
  - multi-turn agent KV cache retention TTL
  - chat template token span mapping serving
  - message boundary metadata LLM serving
  - SGLang RadixAttention multi-turn agent
  - vLLM prefix caching agent workload
  - LMCache agent KV reuse

tier_2_agent_workload_evidence: # 轨迹 / workload / 机理证据：E1–E3 实验原料与动机数据
  - coding agent trace KV cache analysis
  - agent trajectory prefill amplification
  - long horizon agent context growth cost
  - agent trajectory dataset tool calls open
  - agent context management benchmark KV
  - multi-agent shared prefix cache
  - tool result attention KV interpretability
  # 纯文本层 agent 上下文管理：只在"产出可被 KV 层消费的结构信号"时保留（见 deprioritize 例外）
  - typed episode agent context eviction
  - agent context lifecycle failed tool call pruning

# ─────────────────────────────────────────────────────────────
# 降级层（每周一搜）
# ─────────────────────────────────────────────────────────────
tier_3_kv_algorithm_baselines: # 纯算法 KV 压缩，仅作 baseline 追踪
  # 进入 digest 的条件（满足其一）：
  #   a) 在主流 benchmark 上刷新 SOTA，可能成为 E1 必须对比的新 baseline；
  #   b) 首次在 agent / 多轮 / 工具调用场景上评测；
  #   c) 提出可复用的 chunk / block 级机制（可被结构信号驱动）。
  # 满足条件也只进"📦 Baseline 动态"分区，不进 🔥。
  - KV cache compression
  - KV cache eviction attention score
  - semantic chunk KV cache
  - KV cache quantization
  - token pruning attention
  - attention sink StreamingLLM

tier_4_positional_adjacent: # 位置编码 / 外推背景，低频
  - RoPE extrapolation
  - YaRN RoPE scaling
  - position interpolation long context
  - state space model long context KV alternative

